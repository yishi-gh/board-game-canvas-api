<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Report</title>
  <style>
$css
  </style>
</head>
<body>
  <div class="canvas">
    <section class="report-panel">
      <div class="eyebrow">Battle Report</div>
      <h1 class="title">Table Chronicle</h1>
      <div class="report-body">$report_html</div>
    </section>
    <aside class="player-card">
      <div class="player-label">Player Spotlight</div>
      <div class="player-name">$player_name</div>
      <div class="player-score-caption">Score</div>
      <div class="player-score">$player_score</div>
      <p class="player-quote">$player_quote</p>
    </aside>
  </div>
</body>
</html>
